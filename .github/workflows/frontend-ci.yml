name: Frontend Test Suite 🚀

# Only run when frontend files (or shared configs) change
on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: ["main", "dev"]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Frontend - Unit & Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: production
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x]

    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install deps
        run: npm install
        working-directory: ./frontend

      - name: Build (for tests that rely on build)
        run: npm run build --if-present
        working-directory: ./frontend

      - name: Run unit tests with coverage (Jest)
        run: npm run test:coverage --if-present -- --coverageDirectory=coverage --coverageReporters=lcov
        working-directory: ./frontend

      - name: Upload unit test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-jest-logs-${{ matrix.os }}
          path: |
            frontend/coverage/
            frontend/jest-report/
            frontend/test-results/
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: frontend/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend,unit,${{ matrix.os }}
          name: frontend-coverage-${{ matrix.os }}
          fail_ci_if_error: false
          verbose: true
